name: Upload to TestFlight

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Distribution Cert & Profile
        env:
          CERT_P12_B64: ${{ secrets.CERT_P12_B64 }}
          CERT_P12_PASSWORD: ${{ secrets.CERT_P12_PASSWORD }}
          PROFILE_B64: ${{ secrets.PROFILE_B64 }}
        run: |
          set -e
          KEYCHAIN=build.keychain
          KEYCHAIN_PWD=ci-keychain
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          echo "$CERT_P12_B64" | base64 -d > /tmp/dist.p12
          security import /tmp/dist.p12 -k "$KEYCHAIN" -P "$CERT_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN"
          mkdir -p ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles
          echo "$PROFILE_B64" | base64 -d > ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/SurvivalPlan_AppStore.mobileprovision
          security find-identity -v -p codesigning

      - name: Archive (Explicit Signing)
        run: |
          xcodebuild archive \
            -project "生存计划.xcodeproj" \
            -scheme "生存计划" \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SurvivalPlan.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=85W7242G74 \
            CODE_SIGN_IDENTITY="Apple Distribution: faqiang rao (85W7242G74)" \
            PROVISIONING_PROFILE_SPECIFIER="SurvivalPlan AppStore"

      - name: Export IPA
        run: |
          echo "" | base64 -d > /tmp/exportOptions.plist
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SurvivalPlan.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist /tmp/exportOptions.plist
          ls -la "$RUNNER_TEMP/export/"

      - name: Upload to App Store Connect (TestFlight)
        env:
          ASC_API_KEY_B64: ${{ secrets.ASC_API_KEY_B64 }}
          API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_API_KEY_B64" | base64 -d > ~/private_keys/AuthKey_${API_KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${API_KEY_ID}.p8
          xcrun altool --upload-app \
            -f "$RUNNER_TEMP/export/SurvivalPlan.ipa" \
            -t ios \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$ISSUER_ID" \
            --verbose
